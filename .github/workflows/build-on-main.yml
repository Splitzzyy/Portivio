name: Build & Push on Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml
    secrets: inherit

  update-badges:
    name: Update Test Badges
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and Push Badges
        run: |
          mkdir -p docs/badges

          if [ "${{ needs.backend.result }}" == "success" ]; then
            curl -s "https://img.shields.io/badge/Backend_Tests-Passed-success" > docs/badges/backend-status.svg
          else
            curl -s "https://img.shields.io/badge/Backend_Tests-Failed-critical" > docs/badges/backend-status.svg
          fi

          if [ "${{ needs.frontend.result }}" == "success" ]; then
            curl -s "https://img.shields.io/badge/Frontend_Tests-Passed-success" > docs/badges/frontend-status.svg
          else
            curl -s "https://img.shields.io/badge/Frontend_Tests-Failed-critical" > docs/badges/frontend-status.svg
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/badges/backend-status.svg docs/badges/frontend-status.svg
          git commit -m "chore: update test status badges [skip ci]" || { echo "No changes to commit"; exit 0; }
          git push origin HEAD:main
