name: Build & Push on Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      APP_SETTINGS: ${{ secrets.APP_SETTINGS }}

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}

  update-badges:
    name: Update Test Badges
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and Push Badges
        run: |
          mkdir -p temp_badges
          
          if [ "${{ needs.backend.result }}" == "success" ]; then
            curl -s "https://img.shields.io/badge/Backend_Tests-Passed-success" > temp_badges/backend-status.svg
          else
            curl -s "https://img.shields.io/badge/Backend_Tests-Failed-critical" > temp_badges/backend-status.svg
          fi
          
          if [ "${{ needs.frontend.result }}" == "success" ]; then
            curl -s "https://img.shields.io/badge/Frontend_Tests-Passed-success" > temp_badges/frontend-status.svg
          else
            curl -s "https://img.shields.io/badge/Frontend_Tests-Failed-critical" > temp_badges/frontend-status.svg
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Try to switch to badges branch, create if it doesn't exist
          git fetch origin badges:badges || true
          if git rev-parse --verify badges >/dev/null 2>&1; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf .
          fi
          
          cp temp_badges/*.svg ./
          git add backend-status.svg frontend-status.svg
          git commit -m "chore: update test status badges [skip ci]" || echo "No changes to commit"
          git push origin badges


