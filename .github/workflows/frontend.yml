name: Frontend CI

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      FRONTEND_ENV:
        required: false

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Frontend Build & Push
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate environment file
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          mkdir -p src/environments
          if [ -n "$FRONTEND_ENV" ]; then
            printf '%s' "$FRONTEND_ENV" > src/environments/environment.prod.ts
          else
            echo "Using dummy environment file (secret missing)"
            echo "export const environment = { production: true, showSip: true, apiUrl: '', oauth: { google: { clientId: '' } } };" > src/environments/environment.prod.ts
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test -- --watch=false --browsers=ChromeHeadless --no-progress

      - name: Build (production)
        run: bun run prod

      - name: Setup Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push UI image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          push: true
          tags: |
            rghvgrv/portifio-ui:latest
            rghvgrv/portifio-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old UI tags (keep 3)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Authenticating with Docker Hub..."
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKERHUB_USERNAME}\", \"password\": \"${DOCKERHUB_TOKEN}\"}" \
            | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Failed to obtain Docker Hub token"
            exit 1
          fi
          echo "✓ Authentication successful"

          echo "Fetching tags from rghvgrv/portifio-ui..."
          TAGS=$(curl -s -H "Authorization: JWT ${TOKEN}" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/portifio-ui/tags/?page_size=100&ordering=-last_updated" \
            | jq -r '.results[].name' | grep -v '^latest$' || true)

          TOTAL_TAGS=$(echo "$TAGS" | grep -v '^$' | wc -l)
          echo "Found $TOTAL_TAGS tags (excluding 'latest')"
          
          if [ "$TOTAL_TAGS" -le 3 ]; then
            echo "✓ Tag count ($TOTAL_TAGS) is within limit (3). No deletion needed."
            exit 0
          fi

          echo "Keeping 3 most recent tags, deleting $(($TOTAL_TAGS - 3)) old tags..."
          echo "$TAGS" | tail -n +4 | while read -r tag; do
            [ -z "$tag" ] && continue
            echo "  → Deleting: $tag"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
              -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/portifio-ui/tags/${tag}/")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "    ✓ Deleted successfully"
            else
              echo "    ✗ Delete failed with HTTP $HTTP_CODE"
            fi
          done
          echo "✓ Pruning complete"
