name: Backend CI

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      APP_SETTINGS:
        required: false

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Backend Build & Push
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Portivio.slnx

      - name: Build (Release)
        run: dotnet build Portivio.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Portivio.Tests/Portivio.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Setup Docker Buildx
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          push: true
          tags: |
            rghvgrv/portifio-api:latest
            rghvgrv/portifio-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old API tags (keep 3)
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Authenticating with Docker Hub..."
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKERHUB_USERNAME}\", \"password\": \"${DOCKERHUB_TOKEN}\"}" \
            | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Failed to obtain Docker Hub token"
            exit 1
          fi
          echo "✓ Authentication successful"

          echo "Fetching tags from rghvgrv/portifio-api..."
          TAGS=$(curl -s -H "Authorization: JWT ${TOKEN}" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/portifio-api/tags/?page_size=100&ordering=-last_updated" \
            | jq -r '.results[].name' | grep -v '^latest$' || true)

          TOTAL_TAGS=$(echo "$TAGS" | grep -v '^$' | wc -l)
          echo "Found $TOTAL_TAGS tags (excluding 'latest')"
          
          if [ "$TOTAL_TAGS" -le 3 ]; then
            echo "✓ Tag count ($TOTAL_TAGS) is within limit (3). No deletion needed."
            exit 0
          fi

          echo "Keeping 3 most recent tags, deleting $(($TOTAL_TAGS - 3)) old tags..."
          echo "$TAGS" | tail -n +4 | while read -r tag; do
            [ -z "$tag" ] && continue
            echo "  → Deleting: $tag"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
              -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/portifio-api/tags/${tag}/")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "    ✓ Deleted successfully"
            else
              echo "    ✗ Delete failed with HTTP $HTTP_CODE"
            fi
          done
          echo "✓ Pruning complete"
