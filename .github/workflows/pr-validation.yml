name: PR Validation

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Portivio.slnx

      - name: Build (Release)
        run: dotnet build Portivio.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Portivio.Tests/Portivio.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dummy environment file
        run: |
          mkdir -p src/environments
          echo "export const environment = { production: true, apiUrl: '' };" > src/environments/environment.prod.ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test -- --watch=false --browsers=ChromeHeadless --no-progress

      - name: Build (production)
        run: bun run prod
