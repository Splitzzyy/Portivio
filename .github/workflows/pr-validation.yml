name: PR Validation

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml
    secrets: inherit
