server {
    listen 80;
    access_log off;
    server_name localhost;

    # 2. Set error logs to only show 'warn' level and above
    # (This will still show things like "Connection refused" or 4xx/5xx errors)
    error_log /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend service within docker-compose network
    location /api/ {
        proxy_pass http://backend:5274/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: increase client max body size for file uploads
    client_max_body_size 50M;
}
