<div class="main-layout">
  <!-- Sidebar Navigation -->
  <aside class="sidebar" [class.sidebar-open]="sidebarOpen" [class.sidebar-mobile-open]="showMobileMenu">
    <div class="sidebar-header">
      <h2 class="logo">
        <i class="fas fa-chart-pie"></i>
        <span *ngIf="sidebarOpen">Portivio</span>
      </h2>
      <button class="sidebar-toggle" (click)="toggleSidebar()">
        <i class="fas fa-chevron-left"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li class="nav-item">
          <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
            <i class="fas fa-chart-pie" aria-hidden="true"></i>
            <span *ngIf="sidebarOpen">Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/dashboard/profiles" routerLinkActive="active" class="nav-link">
            <i class="fas fa-users"></i>
            <span *ngIf="sidebarOpen">Profiles</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/dashboard/holdings" routerLinkActive="active" class="nav-link">
            <i class="fas fa-wallet"></i>
            <span *ngIf="sidebarOpen">Holdings</span>
          </a>
        </li>
        <li class="nav-item">
          <button type="button" class="nav-link nav-button-link" (click)="openAddInvestmentModal()">
            <i class="fas fa-plus-circle"></i>
            <span *ngIf="sidebarOpen">Add Investment</span>
          </button>
        </li>
        <li class="nav-item">
          <a routerLink="/dashboard/transactions" routerLinkActive="active" class="nav-link">
            <i class="fas fa-exchange-alt"></i>
            <span *ngIf="sidebarOpen">Transactions</span>
          </a>
        </li>
        <li class="nav-item" *ngIf="environment.showSip">
          <a routerLink="/dashboard/sip-plans" routerLinkActive="active" class="nav-link">
            <i class="fas fa-repeat"></i>
            <span *ngIf="sidebarOpen">SIP Plans</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <div class="main-content">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" (click)="toggleMobileMenu()">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="page-title">Portivio</h1>
      </div>

      <div class="header-right">
        <!-- Theme Toggle & User -->
        <div class="header-icons">
          <!-- Theme Switch -->
          <div class="theme-switch" (click)="toggleTheme()" [title]="themeLabel()">
            <div class="switch-track" [class.dark]="isDarkMode">
              <div class="switch-thumb">
                <i class="fas" [ngClass]="isDarkMode ? 'fa-moon' : 'fa-sun'"></i>
              </div>
            </div>
          </div>

          <!-- User Dropdown -->
          <div class="user-dropdown">
            <button
              class="icon-btn user-btn"
              type="button"
              (click)="toggleUserDropdown($event)"
              [attr.aria-expanded]="dropdownOpen"
              aria-haspopup="menu"
              aria-label="Open user menu"
            >
              <div class="user-avatar">
                {{ getUserInitials() }}
              </div>
            </button>

            <!-- Dropdown Menu -->
            <div class="dropdown-menu" [class.show]="dropdownOpen" role="menu">
              <div class="dropdown-header">
                <div class="user-info">
                  <div class="user-avatar-large">
                    {{ getUserInitials() }}
                  </div>
                  <div>
                    <p class="user-name">{{ user?.name }}</p>
                    <p class="user-email">{{ user?.email }}</p>
                  </div>
                </div>
              </div>

              <div class="dropdown-divider"></div>

              <ul class="dropdown-menu-items">
                <li>
                  <a href="javascript:void(0)" (click)="goToProfile()" class="dropdown-item">
                    <i class="fas fa-user"></i>
                    <span>My Profile</span>
                  </a>
                </li>
                <li>
                  <a href="javascript:void(0)" (click)="goToSettings()" class="dropdown-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                  </a>
                </li>
              </ul>

              <div class="dropdown-divider"></div>

              <ul class="dropdown-menu-items">
                <li>
                  <a href="javascript:void(0)" (click)="logout()" class="dropdown-item logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Mobile Overlay -->
<div class="mobile-overlay" *ngIf="showMobileMenu" (click)="toggleMobileMenu()"></div>
