<div class="page-container">
  <div class="page-header">
    <h1 class="page-heading">My Profile</h1>
    <p class="page-subtitle">Manage your personal information and security settings.</p>
  </div>

  <div class="profile-grid">
    
    <!-- Profile Info Card -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Profile Information</h2>
      </div>
      <div class="card-body">
        <form [formGroup]="profileForm" (ngSubmit)="onUpdateProfile()">
          
          <div *ngIf="profileError" class="alert alert-danger">
            {{ profileError }}
          </div>
          <div *ngIf="profileSuccess" class="alert alert-success">
            Profile updated successfully.
          </div>

          <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" formControlName="name" placeholder="Your name"
                   autocomplete="name">
            <div *ngIf="profileForm.get('name')?.invalid && profileForm.get('name')?.touched" class="text-danger">
              Valid name is required.
            </div>
          </div>

          <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid || profileUpdating">
            <span *ngIf="profileUpdating">Updating...</span>
            <span *ngIf="!profileUpdating">Update Profile</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Security Card -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Change Password</h2>
      </div>
      <div class="card-body">
        <form [formGroup]="passwordForm" (ngSubmit)="onChangePassword()">
          
          <div *ngIf="passwordError" class="alert alert-danger">
            {{ passwordError }}
          </div>
          <div *ngIf="passwordSuccess" class="alert alert-success">
            Password changed successfully.
          </div>

          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" formControlName="newPassword" placeholder="Enter new password"
                   autocomplete="new-password">
            <div *ngIf="passwordForm.get('newPassword')?.hasError('minlength') && passwordForm.get('newPassword')?.touched" class="text-danger">
              Password must be at least 6 characters.
            </div>
          </div>

          <div class="form-group form-group-last">
            <label class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" formControlName="confirmPassword" placeholder="Confirm new password"
                   autocomplete="new-password">
            <div *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched" class="text-danger">
              Passwords do not match.
            </div>
          </div>

          <button type="submit" class="btn btn-primary" [disabled]="passwordForm.invalid || passwordUpdating">
            <span *ngIf="passwordUpdating">Changing...</span>
            <span *ngIf="!passwordUpdating">Change Password</span>
          </button>
        </form>
      </div>
    </div>

  </div>
</div>
