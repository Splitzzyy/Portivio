services:
  db:
    image: postgres:15-alpine
    container_name: portivio-db
    environment:
      POSTGRES_DB: portivio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portivio"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: portivio-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: portivio-backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5274
      Postgres__ConnectionString: "Host=db;Port=5432;Database=portivio;Username=postgres;Password=postgres"
      Jwt__Key: "ReplaceWithA32CharOrLongerKey_ChangeMe!"
      Jwt__Issuer: "portivio"
      Jwt__Audience: "portivio"
      Email__Host: "mailpit"
      Email__Port: "1025"
      Email__Username: ""
      Email__Password: ""
      Email__FromAddress: "dev@portivio.local"
      Email__FromName: "Portivio Dev"
      Email__EnableSsl: "false"
      Email__FrontendBaseUrl: "http://localhost:4200"
    volumes:
      - ./src/backend/Portivio.API/appsettings.Development.json:/app/appsettings.Development.json:ro
    ports:
      - "5274:5274"

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        API_URL: "http://backend:5274"
    container_name: portivio-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
